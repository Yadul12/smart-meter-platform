version: "3.9"
services:
  smart-meter-platform:
    build: .
    container_name: vardhman-smart-meter-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REQUIRE_AUTH=false
      - DATABASE_URL=sqlite+aiosqlite:///./smart_meter.db
      - DATABASE_URL_SYNC=sqlite:///./smart_meter.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
